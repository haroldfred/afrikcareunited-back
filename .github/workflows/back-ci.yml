# Intégration continue du back-end (US-13), prête pour un dépôt futur (D-24).
# Chaque étape bloque la suite. À l'ouverture du dépôt, épingler chaque action par son empreinte (SHA).
name: back-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contrat:
    name: Contrat d'API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Redocly CLI (règles recommandées)
        run: npx --yes @redocly/cli@2.60.0 lint contracts/afrikcareunited-m0-openapi.yaml --config redocly.yaml
      - name: openapi-spec-validator et contrôles du projet
        run: |
          pip install openapi-spec-validator==0.8.4 pyyaml
          openapi-spec-validator contracts/afrikcareunited-m0-openapi.yaml
          python3 tools/check_contract.py contracts/afrikcareunited-m0-openapi.yaml

  environnement:
    name: Environnement local et realms
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Contrôles statiques (versions, ports, variables, secrets, réglages Keycloak)
        run: |
          pip install pyyaml
          python3 tools/check_infra.py infra
          python3 tools/check_realms.py infra/keycloak/realms
          python3 tools/realms/build_realms.py "$RUNNER_TEMP"
          diff -u infra/keycloak/realms/afrikcareunited-realm.json "$RUNNER_TEMP/afrikcareunited-realm.json"
          diff -u infra/keycloak/realms/afrikcareunited-equipe-realm.json "$RUNNER_TEMP/afrikcareunited-equipe-realm.json"
      - name: Démarrage de la pile (realms importés, Keycloak prêt)
        working-directory: infra
        run: |
          ./generer-env.sh
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 300
      - name: Initialisation de PostgreSQL
        working-directory: infra
        run: |
          set -a; source .env; set +a
          docker compose exec -T -e PGPASSWORD="$ACU_PG_SUPERUSER_PASSWORD" postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d afrikcareunited -f - < postgres/verifier-initialisation.sql
      - name: Realms importés et découverte OIDC
        run: |
          curl -fsS http://localhost:8180/realms/afrikcareunited/.well-known/openid-configuration > /dev/null
          curl -fsS http://localhost:8180/realms/afrikcareunited-equipe/.well-known/openid-configuration > /dev/null
      - name: Journaux en cas d'échec
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color --tail=200

  construction:
    name: Construction et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn verify (tests unitaires, d'intégration avec Testcontainers, couverture, SBOM)
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rapports-back
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/spring-modulith-docs/
            target/*.cdx.json
          retention-days: 14

  secrets:
    name: Analyse des secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (image officielle)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --no-banner --redact
