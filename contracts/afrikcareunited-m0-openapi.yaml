  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Lister les utilisateurs
      description: >-
        Par défaut, les utilisateurs affectés à l'établissement actif. Un administrateur
        d'organisation peut passer establishment=all. Recherche insensible à la casse et aux
        accents sur le nom, l'e-mail, l'identifiant et le téléphone.
      parameters:
        - $ref: '#/components/parameters/ExpectedContext'
        - name: establishment
          in: query
          required: false
          description: Identifiant d'établissement, ou all pour toute l'organisation.
          schema:
            type: string
            pattern: '^(all|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: >-
            Nom, e-mail ou identifiant de connexion, sans tenir compte des accents ni de la casse ;
            un numéro de téléphone n'est trouvé qu'en entier.
        - name: roleId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserStatus'
          style: form
          explode: false
        - name: mfa
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MfaState'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, lastSeenAt, -lastSeenAt, status, -status]
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Page d'utilisateurs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      x-permissions: [users.read]
      x-user-stories: [US-05]
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Inviter un utilisateur
      description: |
        Deux cas, choisis par le serveur :
        - avec e-mail : l'application envoie un lien d'invitation à usage unique, valable 72 h,
          par sa boîte d'envoi (état dans `invitation.delivery`). Que la personne soit nouvelle ou
          déjà inscrite ailleurs, la réponse est la même ; aucun compte Keycloak n'est créé avant
          l'acceptation ;
        - sans e-mail : identifiant attribué, préfixé par le code de l'organisation, et mot de
          passe provisoire valable 72 h, renvoyé une seule fois dans la réponse 201 (Cache-Control
          no-store), changement imposé à la première connexion. Un renvoi de la même requête
          répond 200 sans le mot de passe : en émettre un autre par /temporary-password.

        L'acteur n'attribue que des rôles dont il détient toutes les permissions, dans des
        établissements qu'il administre (403 sinon). Seul un administrateur d'organisation
        attribue le rôle de délégué à la protection des données, jamais à lui-même ni à un agent
        sans e-mail ; délégué et administrateur d'organisation ne vont jamais à la même personne,
        à aucune date (409 role-combination-forbidden). Toute nomination d'un délégué est notifiée
        au signataire du contrat et aux délégués en place.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      parameters:
        - $ref: '#/components/parameters/ExpectedContext'
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Même identifiant et même contenu déjà reçus ; invitation existante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '201':
          description: Utilisateur invité.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-permissions: [users.invite]
      x-user-stories: [US-04]
      x-audit-action: [user.invited, user.created]

