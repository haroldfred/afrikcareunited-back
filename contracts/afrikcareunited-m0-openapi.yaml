openapi: 3.1.1
info:
  title: AfrikCareUnited — API du module M0 Socle
  version: 0.1.0
  summary: Authentification, organisations, utilisateurs, rôles et journal d'audit.
  description: |
    Contrat écrit avant le code, à l'étape 6 du processus du cahier des charges v1.0 (section 4).
    Il est relu par le commanditaire avant toute implémentation.

    **Session.** Le navigateur ne détient aucun jeton : le back-end (BFF) garde les jetons
    Keycloak et pose un cookie de session HttpOnly. Toute requête qui modifie l'état porte
    l'en-tête X-XSRF-TOKEN. Toutes les réponses de l'API portent Cache-Control: no-store.

    **Contexte.** La session porte l'organisation et l'établissement actifs, ou toute
    l'organisation pour un rôle qui la couvre. Sur toute opération propre à une organisation,
    l'application envoie l'en-tête ACU-Context avec le contexte qu'elle affiche :
    `{organisation}/{établissement}` ou `{organisation}/all`. Absent : 400 `context-required` ;
    différent de celui de la session, changé dans un autre onglet : 409 `context-mismatch`, et
    rien n'est fait. Les permissions sont évaluées dans chaque établissement concerné.

    **Double authentification.** Toutes les permissions du M0 sont des permissions
    d'administration (RG-05) : elles exigent une session ouverte avec le second facteur.
    Sinon 403 `mfa-enrollment-required` (à activer) ou `mfa-step-up-required` (à refaire).

    **Activité et verrouillage.** Seules les requêtes déclenchées par la personne (clavier,
    souris, toucher) portent l'en-tête ACU-Activity: user et repoussent le verrouillage ;
    pendant une lecture sans requête, l'application envoie un signal d'activité au plus une
    fois par minute. Après 15 minutes sans activité, la session est verrouillée et sa session
    Keycloak fermée : toute requête répond 423 (`session-locked`, convention privée reprise de
    la RFC 4918) jusqu'à la réauthentification. Exceptions : /config, /auth/*, GET /session
    (vue réduite) et POST /session/lock. Le back-end compte lui-même les 12 h de session depuis
    la première connexion.

    **Erreurs.** Format RFC 9457 (application/problem+json), avec un `code` stable, la liste
    des champs en erreur et une référence `traceId` à donner au support. `type` est une URL
    https://{domaine de l'application}/problems/{code}. Les messages suivent l'en-tête
    Accept-Language (fr ou en).

    **Concurrence.** Les ressources versionnées renvoient un ETag fort : leur `version` entre
    guillemets ("3"). PATCH et DELETE d'une ressource versionnée exigent If-Match : 412 si la
    version a changé, 428 si l'en-tête manque.

    **Idempotence.** Les créations portent un identifiant UUIDv7 choisi par le client : un
    renvoi identique renvoie la ressource déjà créée (200), un renvoi différent répond 409.
    Les actions sensibles exigent l'en-tête Idempotency-Key, une chaîne entre guillemets
    (brouillon IETF, version 08). La clé vaut pour une organisation, un auteur, une méthode
    et un chemin ; seules les réponses 2xx sont conservées, et la même clé rejouée sous 24 h
    renvoie la première d'entre elles. Une erreur n'est pas conservée : la requête peut être
    refaite avec la même clé. Afficher un téléphone, exporter le journal et émettre un
    mot de passe provisoire n'en utilisent pas : chaque appel est une action nouvelle, inscrite
    au journal.

    **Isolation.** Une ressource d'une autre organisation répond 404, jamais 403, pour ne pas
    révéler son existence. L'identifiant technique d'un utilisateur est propre à chaque
    organisation. Un identifiant inconnu ou d'une autre organisation dans un corps de requête
    répond 400 (`validation-failed`, champ en erreur `unknown-reference`).

    **Pagination.** `page` (à partir de 0) et `size` (25 ou 50) ; la réponse donne `page`,
    `size`, `totalItems` et `totalPages`.

    **Évolution.** Les énumérations s'enrichissent à chaque module : un client doit accepter
    une valeur inconnue. Les réponses peuvent gagner des champs ; les corps de requête
    refusent les champs inconnus.

    **Personnes protégées.** Un administrateur d'établissement n'agit que sur les personnes
    dont toutes les affectations en cours ou à venir sont dans ses établissements, et dont il
    détient tous les droits ; un administrateur d'organisation agit sur toutes (403
    `target-out-of-scope`). Nul dans l'organisation ne change l'identifiant de connexion, ne
    réinitialise la double authentification ni n'émet de mot de passe provisoire pour un
    administrateur d'organisation ou un délégué à la protection des données (403
    `protected-account`) : ils passent par leurs codes de secours ou par la procédure de la
    plateforme.

    Extensions : `x-permissions` liste les permissions exigées dans chaque établissement
    concerné (`platform.operator` : membre habilité de l'équipe AfrikCareUnited, dans un realm
    Keycloak à part, double authentification obligatoire) ; `x-target-scope` marque les
    opérations soumises à la règle des personnes protégées ; `x-user-stories` donne les user
    stories couvertes ; `x-audit-action` l'action, ou les actions possibles, inscrites au journal.
  license:
    name: Propriétaire, AfrikCareUnited
servers:
  - url: /api/v1
    description: API JSON servie par le back-end, sur la même origine que l'application.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Parcours du navigateur vers Keycloak (redirections, hors JSON).
  - name: Session
    description: Session courante, contexte de travail, verrouillage et sessions actives.
  - name: Home
    description: Accueil de l'application.
  - name: Me
    description: 'Compte de la personne connectée : profil, sécurité, appartenances.'
  - name: Invitations
    description: Lire, accepter et refuser une invitation ; confirmer ou annuler un changement demandé par e-mail.
  - name: Organization
    description: Organisation active, ses établissements et les accès de support.
  - name: Users
    description: Utilisateurs de l'organisation active, invitations et actions de compte.
  - name: Assignments
    description: Affectations datées d'un utilisateur (établissement et rôles).
  - name: Roles
    description: Rôles système, rôles personnalisés et catalogue des permissions.
  - name: Audit
    description: Journal d'audit en ajout seul, consultation et export.
  - name: Platform
    description: Administration de la plateforme par l'équipe AfrikCareUnited.
  - name: System
    description: Configuration publique de l'application.

paths:
  /auth/login:
    servers:
      - url: /
    get:
      tags: [Auth]
      operationId: startLogin
      summary: Démarrer la connexion
      description: >-
        Redirige vers Keycloak (code d'autorisation avec PKCE). Si Keycloak ne répond pas, redirige
        vers la page de connexion de l'application avec le motif, qui affiche « Serveur
        injoignable ». Si une session verrouillée existe dans ce navigateur, Keycloak redemande le
        mot de passe (prompt=login) et une autre personne qui se connecte ferme la session
        verrouillée. Au retour, le back-end ouvre une nouvelle session (nouvel identifiant) et
        redirige vers returnTo : un chemin de l'application, jamais « // », dont l'origine résolue
        est vérifiée. Les membres de l'équipe AfrikCareUnited se connectent par leur realm à part.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: '^/(?!/)[A-Za-z0-9/_\-?=&%.]*$'
            maxLength: 512
      responses:
        '302':
          description: Redirection vers Keycloak, ou vers la page de connexion de l'application si Keycloak ne répond pas.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-user-stories: [US-01]

  /auth/reauth:
    servers:
      - url: /
    get:
      tags: [Auth]
      operationId: startReauthentication
      summary: Réauthentifier pour déverrouiller l'écran
      description: >-
        Ouvert dans une fenêtre séparée par le bouton Déverrouiller, seulement quand la session est
        verrouillée ; sa session Keycloak a été fermée au verrouillage, et le back-end ignore la
        déconnexion que Keycloak lui signale pour cette session. Redirige vers Keycloak avec
        prompt=login, max_age=0 et l'identifiant pré-rempli. Au retour, le back-end vérifie lui-même
        le jeton d'identité : même personne (sub), authentification postérieure au verrouillage
        (auth_time) et second facteur si la personne en a un (amr). Si tout concorde, la session est
        déverrouillée et rattachée à la nouvelle session Keycloak ; sinon, ou si une autre personne
        s'est connectée, la session verrouillée est fermée et la saisie effacée. La fenêtre prévient
        la page par BroadcastChannel ; si le navigateur l'empêche de se fermer, elle invite à la fermer.
      parameters:
        - name: popup
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '302':
          description: Redirection vers Keycloak.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-user-stories: [US-11]
      x-audit-action: auth.session.unlocked

  /auth/account-action:
    servers:
      - url: /
    post:
      tags: [Auth]
      operationId: startAccountAction
      summary: Lancer une action de compte Keycloak
      description: >-
        Action initiée par l'application (paramètre kc_action de Keycloak) : ajouter une application
        d'authentification, générer des codes de secours, changer le mot de passe, ou retirer une
        application d'authentification (delete_credential). Renvoie l'adresse Keycloak où
        l'application se rend ; Keycloak redemande le mot de passe, puis revient sur Mon compte. La
        console de compte de Keycloak est désactivée : ces actions passent toutes par ici.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActionRequest'
      responses:
        '200':
          description: Adresse de l'action Keycloak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectTarget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-02, US-10]

  /auth/logout:
    servers:
      - url: /
    post:
      tags: [Auth]
      operationId: logout
      summary: Se déconnecter
      description: >-
        Ferme la session du back-end, révoque les jetons et renvoie l'adresse de déconnexion
        Keycloak que le navigateur doit ouvrir.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Session fermée.
          headers:
            Clear-Site-Data:
              $ref: '#/components/headers/ClearSiteData'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-user-stories: [US-01]
      x-audit-action: auth.session.closed

  /config:
    get:
      tags: [System]
      operationId: getPublicConfig
      summary: Configuration publique
      description: Environnement, bandeau de démonstration et langues proposées, lus avant la connexion.
      security: []
      responses:
        '200':
          description: Configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Lire la session courante
      description: >-
        Identité, contexte actif, permissions effectives et état de verrouillage. Répond même quand la session est verrouillée, avec une vue réduite, pour que l'écran de verrouillage s'affiche.
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Session ouverte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-user-stories: [US-01, US-03, US-11]

  /session/context:
    put:
      tags: [Session]
      operationId: setSessionContext
      summary: Choisir ou changer l'établissement actif
      description: >-
        Change l'établissement actif, ou passe à toute l'organisation (establishmentId null) si l'un des rôles de la personne la couvre. Les autres onglets le découvrent par 409 context-mismatch.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionContextUpdate'
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Contexte mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-03]
      x-audit-action: context.establishment.selected

  /session/establishments:
    get:
      tags: [Session]
      operationId: listSelectableEstablishments
      summary: Lister les établissements où l'utilisateur peut travailler aujourd'hui
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Établissements regroupés par organisation, le dernier utilisé en tête.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SelectableOrganization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-03]

  /session/heartbeat:
    post:
      tags: [Session]
      operationId: sendHeartbeat
      summary: Signaler une activité de l'utilisateur
      description: >-
        Signal d'activité, envoyé au plus une fois par minute pendant une saisie, avec
        ACU-Activity: user. Sans cet en-tête, il ne repousse pas le verrouillage.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Activité enregistrée.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-11]
      parameters:
        - $ref: '#/components/parameters/UserActivity'

  /session/lock:
    post:
      tags: [Session]
      operationId: lockSession
      summary: Verrouiller la session maintenant
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '204':
          description: Session verrouillée.
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-user-stories: [US-11]
      x-audit-action: auth.session.locked

  /session/sessions:
    get:
      tags: [Session]
      operationId: listMySessions
      summary: Lister mes sessions actives
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Sessions ouvertes, la session courante marquée.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-10]

  /session/sessions/{sessionId}:
    delete:
      tags: [Session]
      operationId: revokeMySession
      summary: Fermer une de mes autres sessions
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '204':
          description: Session fermée, y compris côté Keycloak.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-10]
      x-audit-action: auth.session.closed

  /session/sessions/revoke-others:
    post:
      tags: [Session]
      operationId: revokeOtherSessions
      summary: Fermer toutes mes autres sessions
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Nombre de sessions fermées.
          content:
            application/json:
              schema:
                type: object
                required: [closedSessions]
                properties:
                  closedSessions:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-10]
      x-audit-action: auth.session.closed

  /home/tasks:
    get:
      tags: [Home]
      operationId: listHomeTasks
      summary: Éléments « À traiter » de l'accueil
      description: >-
        Invitations qui expirent dans les 48 heures, comptes bloqués, affectations qui se
        terminent dans les 14 jours et demandes d'accès de support en attente. Seulement ce
        que l'acteur peut traiter dans le contexte actif ; liste vide sinon.
      parameters:
        - $ref: '#/components/parameters/ExpectedContext'
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Éléments, les plus urgents en tête.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/HomeTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-04, US-06, US-09]

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Lire mon compte
      description: L'état de la double authentification est relu dans Keycloak à chaque appel.
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Compte de l'utilisateur connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-10]
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Modifier ma langue ou mes coordonnées
      description: >-
        Nom, téléphone, langue et adresse e-mail de la personne connectée. Une nouvelle adresse ne
        s'applique qu'après confirmation par le lien qui lui est envoyé ; l'ancienne reçoit un avis
        avec un lien d'annulation.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/UserActivity'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: Compte modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '423':
          $ref: '#/components/responses/Locked'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
      x-user-stories: [US-10]
      x-audit-action: [user.updated, user.login-change.requested]

  /me/security-events:
    get:
      tags: [Me]
      operationId: listMySecurityEvents
      summary: Lister les événements de sécurité de mon identité
      description: >-
        Connexions réussies et échouées, blocages, changements de mot de passe et de double
        authentification, toutes organisations confondues. Ils ne figurent pas dans le
        journal des organisations, qui ne voient que les connexions faites chez elles.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Événements, du plus récent au plus ancien.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySecurityEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-10]

  /me/memberships/{organizationId}/leave:
    post:
      tags: [Me]
      operationId: leaveOrganization
      summary: Quitter une organisation
      description: >-
        Termine l'appartenance de la personne connectée à cette organisation et ses affectations,
        même si elle est suspendue ; l'application demande d'abord une confirmation à l'écran.
        Refusé au dernier administrateur d'organisation (409). Inscrit au journal de
        l'organisation ; les autres organisations n'en sont pas informées.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Appartenance terminée ; la session reste ouverte pour les autres organisations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '423':
          $ref: '#/components/responses/Locked'
      x-user-stories: [US-10]
      x-audit-action: user.membership.left

  /invitations/inspect:
    post:
      tags: [Invitations]
      operationId: inspectInvitation
      summary: Lire une invitation reçue
      description: >-
        Appelé par la page de l'invitation avec le jeton lu dans le fragment du lien (#), que la page
        retire aussitôt de la barre d'adresse et de l'historique. Ne révèle rien d'autre que
        l'invitation elle-même. 423 si une session verrouillée existe dans ce navigateur.
      security:
        - {}
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Invitation et prochaine étape pour la personne.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-user-stories: [US-04]

  /invitations/accept:
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accepter une invitation
      description: >-
        Nouvelle personne : le compte Keycloak est créé à la première acceptation, sans mot de passe,
        et Keycloak envoie l'e-mail de création du mot de passe (lien de 30 minutes) ; jusqu'à la
        première connexion, et au plus 72 h après l'envoi de l'invitation, un nouvel appel avec le
        même jeton renvoie cet e-mail (202, limité en fréquence). L'appartenance devient active à la
        première connexion. Personne déjà inscrite : elle doit être connectée avec l'identité
        invitée ; l'appartenance devient active aussitôt et le lien ne sert plus. 423 si une session
        verrouillée existe dans ce navigateur.
      security:
        - {}
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Appartenance activée ; l'établissement peut être choisi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '202':
          description: Nouvelle personne ; l'e-mail Keycloak de création du mot de passe est envoyé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordSetupSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-user-stories: [US-04]
      x-audit-action: user.invitation.accepted

