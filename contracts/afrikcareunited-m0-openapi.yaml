        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      x-permissions: [users.read]
      x-user-stories: [US-05, US-06]
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Modifier un utilisateur
      description: >-
        Fonction et politique de double authentification toujours modifiables. Nom, identifiant de
        connexion, téléphone et langue seulement si profileManagedBy vaut organization ; sinon 409
