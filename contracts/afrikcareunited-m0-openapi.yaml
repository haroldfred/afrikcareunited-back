  /account-confirmations/confirm:
    post:
      tags: [Invitations]
      operationId: confirmAccountChange
      summary: Confirmer un changement demandé par e-mail
      description: >-
        Nouvelle adresse e-mail : appliquée aussitôt, et Keycloak mis à jour. Réinitialisation de la
        double authentification : la réponse donne la page Keycloak (client acu-confirm, avec
        prompt=login et max_age=0) où la personne doit saisir son mot de passe, même si une session
        Keycloak est ouverte dans ce navigateur. Au retour, le back-end exige la même personne (sub)
        et une authentification postérieure à l'envoi du lien (auth_time) ; sinon rien n'est fait. Le
        changement est revérifié à ce moment (par exemple, une appartenance apparue entre-temps
        l'annule). 423 si une session verrouillée existe dans ce navigateur.
      security:
        - {}
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationReference'
      parameters:
        - $ref: '#/components/parameters/UserActivity'
      responses:
        '200':
          description: Changement appliqué, ou mot de passe à saisir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
